name: iOS Tests (Optional)

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - '**.swift'
      - 'msyuiTests/**'
      - 'msyuiUITests/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.swift'
      - 'msyuiTests/**'
      - 'msyuiUITests/**'

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Create and run on simulator
      run: |
        # Find available iPhone simulators
        echo "=== Creating iPhone Simulator ==="
        SIMULATOR_NAME="iPhone 15"
        DEVICE_UUID=$(xcrun simctl create "ci-test-simulator" "iPhone 15" "iOS18.2" 2>/dev/null || xcrun simctl create "ci-test-simulator" "iPhone 14" "iOS17.5" 2>/dev/null || echo "")

        if [ -n "$DEVICE_UUID" ]; then
          echo "Created simulator: $DEVICE_UUID"
          echo "SIMULATOR_UUID=$DEVICE_UUID" >> $GITHUB_ENV
        else
          echo "Using existing simulator"
          # Try to find any available iPhone simulator
          DEVICE_UUID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | sed 's/.*(\(.*\)).*/\1/')
          echo "SIMULATOR_UUID=$DEVICE_UUID" >> $GITHUB_ENV
        fi

        echo "Using simulator: $DEVICE_UUID"

    - name: Run unit tests
      run: |
        if [ -n "$SIMULATOR_UUID" ]; then
          echo "Running tests on simulator: $SIMULATOR_UUID"
          xcodebuild test \
            -project msyui.xcodeproj \
            -scheme msyui \
            -destination "id=$SIMULATOR_UUID" \
            -enableCodeCoverage YES \
            | xcpretty || true
        else
          echo "⚠️ No simulator available, skipping tests"
          echo "This is normal if the project doesn't have test targets configured"
        fi
      continue-on-error: true

    - name: Test Summary
      if: always()
      run: |
        echo "## 🧪 Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Tests were run on iOS Simulator" >> $GITHUB_STEP_SUMMARY
        echo "- Check the logs above for detailed results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ℹ️ Note" >> $GITHUB_STEP_SUMMARY
        echo "Test failures will not block the main build workflow." >> $GITHUB_STEP_SUMMARY
        echo "The primary build workflow focuses on generating the IPA file." >> $GITHUB_STEP_SUMMARY