name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA for Third-party Signing
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Show available schemes
      run: |
        echo "=== Available Schemes ==="
        xcodebuild -list -project msyui.xcodeproj
        echo ""
        echo "=== Available Simulators ==="
        xcrun simctl list devices available | grep iPhone | head -5 || echo "Simulators check complete"

    - name: Build and Archive (for third-party signing)
      run: |
        echo "Building for iOS (generic platform)..."
        xcodebuild archive \
          -project msyui.xcodeproj \
          -scheme msyui \
          -archivePath build/msyui.xcarchive \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_BITCODE=NO \
          | xcpretty || cat build.log | tail -20

    - name: Check archive
      run: |
        echo "=== Archive Contents ==="
        ls -la build/msyui.xcarchive/
        echo ""
        echo "=== Applications ==="
        ls -la build/msyui.xcarchive/Products/Applications/ || echo "No apps found"

    - name: Export IPA for third-party signing
      run: |
        echo "Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath build/msyui.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist ExportOptionsThirdParty.plist

    - name: Verify IPA
      run: |
        echo "=== IPA File ==="
        find build/export -name "*.ipa" -exec ls -lh {} \;
        echo ""
        echo "=== Build Summary ==="
        du -sh build/export/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyui-ipa-${{ github.run_number }}
        path: build/export/*.ipa
        retention-days: 30

    - name: Upload dSYM artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyui-dsym-${{ github.run_number }}
        path: build/msyui.xcarchive/dSYMs/**/*.dSYM
        retention-days: 30
      if: success()

    - name: Create Release Summary
      run: |
        echo "## 🎉 iOS Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Available Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- \`msyui-ipa-${{ github.run_number }}\`: IPA file ready for third-party signing" >> $GITHUB_STEP_SUMMARY
        echo "- \`msyui-dsym-${{ github.run_number }}\`: Symbol files for crash analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Third-Party Signing Instructions" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the IPA from the artifacts section below" >> $GITHUB_STEP_SUMMARY
        echo "2. Use your preferred third-party signing service" >> $GITHUB_STEP_SUMMARY
        echo "3. Or manually re-sign using your certificates" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Installation" >> $GITHUB_STEP_SUMMARY
        echo "After signing, install via:" >> $GITHUB_STEP_SUMMARY
        echo "- **Direct download**: Install the signed IPA directly" >> $GITHUB_STEP_SUMMARY
        echo "- **AltStore**: Sideload on your device" >> $GITHUB_STEP_SUMMARY
        echo "- **TestFlight**: Upload to App Store Connect" >> $GITHUB_STEP_SUMMARY

    - name: Build Complete
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 IPA is ready for third-party signing"
        echo "🔗 Check the Artifacts section to download"