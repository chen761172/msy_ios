name: iOS CI

on:
  workflow_dispatch:  # 只允许手动触发

jobs:
  build:
    name: Build IPA for Third-party Signing
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show environment info
      run: |
        echo "=== Xcode Version ==="
        xcodebuild -version
        echo ""
        echo "=== Available Schemes ==="
        xcodebuild -list -project msyui.xcodeproj
        echo ""
        echo "=== Available Simulators ==="
        xcrun simctl list devices available | grep iPhone | head -3 || echo "No simulators"

    - name: Create build directories
      run: |
        mkdir -p build/export
        mkdir -p build/temp

    - name: Build the app
      run: |
        echo "🔨 Building iOS app..."

        # Try building for simulator first, then rebuild for device
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
          -project msyui.xcodeproj \
          -scheme msyui \
          -configuration Release \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          CONFIGURATION_BUILD_DIR=build/temp-sim \
          || echo "⚠️ Simulator build failed, trying device build..."

        echo "📱 Building for iOS Device..."
        xcodebuild build \
          -project msyui.xcodeproj \
          -scheme msyui \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          CONFIGURATION_BUILD_DIR=build/temp \
          || {
            echo "❌ Build failed"
            echo "🔍 Checking source files..."
            find . -name "*.swift" -type f | head -5
            exit 1
          }

        echo "✅ Build completed"
        echo "📁 Build output:"
        ls -la build/temp/

        # Check if app bundle was created with executable
        if [ -f "build/temp/msyui.app/msyui" ]; then
          echo "✅ App executable found"
          echo "📱 App bundle contents:"
          ls -la build/temp/msyui.app/
        else
          echo "❌ App executable not found"
          echo "🔍 Full contents of build/temp:"
          ls -laR build/temp/

          # Try to find if executable was built elsewhere
          echo "🔍 Searching for built executable..."
          find build/temp -name "msyui" -type f
          find build/temp -name "*.app" -type d

          exit 1
        fi

    - name: Create IPA manually
      run: |
        echo "📦 Creating IPA file manually..."

        # Create Payload directory
        mkdir -p build/export/Payload

        # Copy the app bundle to Payload
        if [ -d "build/temp/msyui.app" ]; then
          echo "📱 Copying app bundle..."
          cp -r build/temp/msyui.app build/export/Payload/

          # Create the IPA file
          echo "📦 Creating IPA..."
          cd build/export
          zip -qr msyui.ipa Payload/
          cd ../..

          echo "✅ IPA created successfully"
          echo "📦 IPA file info:"
          ls -lh build/export/msyui.ipa

          # Verify IPA structure
          echo "🔍 IPA contents:"
          unzip -l build/export/msyui.ipa | head -10

        else
          echo "❌ App bundle not found at build/temp/msyui.app"
          echo "🔍 Available files:"
          find build/temp -name "*.app" 2>/dev/null || echo "No app bundles found"
          exit 1
        fi

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyui-ipa-${{ github.run_number }}
        path: build/export/msyui.ipa
        retention-days: 30
      if: success()

    - name: Upload app bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyui-app-bundle-${{ github.run_number }}
        path: build/temp/msyui.app
        retention-days: 30
      if: success()

    - name: Create detailed summary
      if: success()
      run: |
        echo "## 🎉 iOS Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **Xcode Version**: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Available Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 1. IPA File (Ready for signing)" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifact Name**: \`msyui-ipa-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Description**: IPA file ready for third-party signing" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $(du -h build/export/msyui.ipa | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Usage**: Download and sign with your certificates" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 2. App Bundle (Optional)" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifact Name**: \`msyui-app-bundle-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Description**: Unsigned .app bundle for advanced usage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 How to Use This IPA" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### For Third-Party Signing:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the IPA from artifacts below" >> $GITHUB_STEP_SUMMARY
        echo "2. Upload to signing service (蒲公英, Fir.im, etc.)" >> $GITHUB_STEP_SUMMARY
        echo "3. Or manually re-sign:" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "   # Unsign old signature" >> $GITHUB_STEP_SUMMARY
        echo "   codesign --remove-signature msyui.app" >> $GITHUB_STEP_SUMMARY
        echo "   # Sign with your certificate" >> $GITHUB_STEP_SUMMARY
        echo "   codesign -f -s \"Your Certificate\" msyui.app" >> $GITHUB_STEP_SUMMARY
        echo "   # Rebuild IPA" >> $GITHUB_STEP_SUMMARY
        echo "   zip -r msyui_signed.ipa Payload/" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### For Installation:" >> $GITHUB_STEP_SUMMARY
        echo "- **AltStore**: Sideload on your device" >> $GITHUB_STEP_SUMMARY
        echo "- **Sideloadly**: Windows alternative to AltStore" >> $GITHUB_STEP_SUMMARY
        echo "- **TestFlight**: After proper signing and upload" >> $GITHUB_STEP_SUMMARY

    - name: Success message
      run: |
        echo "✅ ======================================="
        echo "✅  Build completed successfully!"
        echo "✅ ======================================="
        echo "📦 IPA is ready for third-party signing"
        echo "🔗 Check the Artifacts section to download"
        echo "📱 Artifact name: msyui-ipa-${{ github.run_number }}"
        echo "💾 Size: $(du -h build/export/msyui.ipa | cut -f1)"
        echo "========================================"