name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA for Third-party Signing
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: |
        echo "Xcode Version:"
        xcodebuild -version
        echo ""
        echo "Available Schemes:"
        xcodebuild -list -project msyui.xcodeproj

    - name: Create build directory
      run: mkdir -p build/export

    - name: Build and Archive (for third-party signing)
      run: |
        echo "Starting build process..."
        set -o pipefail

        # Build archive without signing
        xcodebuild archive \
          -project msyui.xcodeproj \
          -scheme msyui \
          -archivePath build/msyui.xcarchive \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_BITCODE=NO \
          CODE_SIGN_ENTITLES="" \
          CODE_SIGNING_ALLOWED=NO \
          || {
            echo "❌ Archive creation failed"
            exit 1
          }

        echo "✅ Archive created successfully"

        # Check if archive was created
        if [ ! -d "build/msyui.xcarchive" ]; then
          echo "❌ Archive directory not found"
          exit 1
        fi

        echo "📦 Archive contents:"
        ls -la build/msyui.xcarchive/Products/Applications/ || echo "No applications found"

    - name: Export IPA for third-party signing
      run: |
        echo "Starting IPA export..."

        # Create a simple export options plist if needed
        if [ ! -f "ExportOptionsThirdParty.plist" ]; then
          echo "Creating export options plist..."
          cat > ExportOptionsThirdParty.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
        </dict>
        </plist>
        EOF
        fi

        # Export IPA
        xcodebuild -exportArchive \
          -archivePath build/msyui.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist ExportOptionsThirdParty.plist \
          || {
            echo "❌ IPA export failed"
            exit 1
          }

        echo "✅ IPA exported successfully"

        # Verify IPA file exists
        if find build/export -name "*.ipa" | grep -q .; then
          echo "🎉 IPA file created successfully:"
          find build/export -name "*.ipa" -exec ls -lh {} \;
        else
          echo "❌ No IPA file found in export directory"
          echo "📁 Export directory contents:"
          ls -la build/export/
          exit 1
        fi

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyui-ipa-${{ github.run_number }}
        path: build/export/*.ipa
        retention-days: 30
      if: success()

    - name: Upload dSYM artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyui-dsym-${{ github.run_number }}
        path: |
          build/msyui.xcarchive/dSYMs/**/*.dSYM
          build/msyui.xcarchive/**/*.app.dSYM
        retention-days: 30
      if: success()

    - name: Build Summary
      if: success()
      run: |
        echo "## 🎉 iOS Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Artifacts Ready for Download" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### IPA File" >> $GITHUB_STEP_SUMMARY
        echo "- **Name**: \`msyui-ipa-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Description**: IPA file ready for third-party signing" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $(find build/export -name "*.ipa" -exec ls -lh {} \; | awk '{print $5}' 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Symbol Files" >> $GITHUB_STEP_SUMMARY
        echo "- **Name**: \`msyui-dsym-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Description**: Debug symbols for crash analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 How to Use" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the IPA from the Artifacts section below" >> $GITHUB_STEP_SUMMARY
        echo "2. Upload to your third-party signing service" >> $GITHUB_STEP_SUMMARY
        echo "3. Or manually re-sign using your own certificates" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Installation Options" >> $GITHUB_STEP_SUMMARY
        echo "- **Direct Installation**: Install signed IPA directly" >> $GITHUB_STEP_SUMMARY
        echo "- **AltStore**: Sideload on your personal device" >> $GITHUB_STEP_SUMMARY
        echo "- **TestFlight**: Upload to App Store Connect" >> $GITHUB_STEP_SUMMARY
        echo "- **Third-party Platform**: Use services like 蒲公英, Fir.im" >> $GITHUB_STEP_SUMMARY

    - name: Build Complete Message
      if: success()
      run: |
        echo "✅ ======================================="
        echo "✅  Build completed successfully!"
        echo "✅ ======================================="
        echo "📦 IPA is ready for third-party signing"
        echo "🔗 Check the Artifacts section to download"
        echo "📱 Artifact name: msyui-ipa-${{ github.run_number }}"
        echo "========================================"